[workspace]
resolver = "2"
members = [
    "crates/dive-cli",
    "crates/dive-core",
    "crates/dive-llm",
    "crates/dive-mcp",
    "crates/dive-store",
    "crates/dive-config",
    "crates/dive-runtime",
]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/loon-rocks/dive"

[workspace.dependencies]
dive-core = { path = "crates/dive-core" }
dive-llm = { path = "crates/dive-llm" }
dive-mcp = { path = "crates/dive-mcp" }
dive-store = { path = "crates/dive-store" }
dive-config = { path = "crates/dive-config" }
dive-runtime = { path = "crates/dive-runtime" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
schemars = "0.8"
jsonschema = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
semver = "1"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
