[package]
name = "dive-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dive"
path = "src/main.rs"

[dependencies]
dive-core.workspace = true
dive-llm.workspace = true
dive-mcp.workspace = true
dive-store.workspace = true
dive-config.workspace = true
dive-runtime = { workspace = true, features = ["clap"] }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
reedline = "0.36"
chrono.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
tokio-util = "0.7"
futures.workspace = true
# TUI stack for `graph workbench` — crossterm pinned to reedline's 0.28 so
# the lockfile carries exactly one copy.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
jsonschema.workspace = true
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
sha2 = "0.10"
semver.workspace = true
tempfile = "3"
rpassword = "7"
toml_edit.workspace = true
# graph as an MCP *server* (`graph mcp serve`). dive-mcp holds the client
# half; the server lives here because what it serves is this crate's command
# layer. Feature-unified with dive-mcp's client build.
rmcp = { version = "2.2", default-features = false, features = [
    "server",
    "transport-io",
    # `ask` steps become elicitation/create requests back to the client
    # (mcp_server/elicit.rs).
    "elicitation",
] }
schemars = "1"

[dev-dependencies]
dive-runtime = { workspace = true, features = ["clap", "fixtures"] }
