$schema: https://json-schema.org/draft/2020-12/schema
title: config.toml
x-format: TOML
x-sections:
  - heading: Secret references
    body: |-
      A string value can include `${NAME}` references, such as `api_key = "${ANTHROPIC_API_KEY}"`. Each reference reads the environment variable `NAME`. When `NAME` isn't set, or is set but empty, graph reads the OS credential store instead: the macOS Keychain, or the Secret Service on Linux, under service `graph` and account `NAME`. The value is resolved each time a config file loads and is never written to a file. Store a value with `graph secret set NAME`, and see every name the config, tools and packs reference, and where each resolves from, with `graph secret list`.

      A name neither source has leaves a provider or MCP server loadable, and using that provider or server fails naming the variable. A missing name anywhere else fails the load.

      Where no credential store is available, as in a container or on Linux without a Secret Service daemon, graph reads the environment only. Set `GRAPH_SECRET_STORE` to `none` to skip the store on purpose.
x-locations:
  - "`~/.config/graph/config.toml` (global)"
  - "`./.graph/config.toml` (project; its values win)"
type: object
additionalProperties: false
properties:
  version:
    type: integer
    description: The file version the config is written in. Omitted means 1; `graph config migrate` brings a file to the current version.
  settings:
    type: object
    description: Runtime settings.
    properties:
      data_dir:
        type: string
        default: ~/.local/share/graph
        description: Where threads and the shape cache are stored.
      max_agent_iterations:
        type: integer
        default: 15
        description: Most model rounds a conversation agent takes in one turn.
      planning_attempts:
        type: integer
        default: 2
        description: Attempts the built-in planner gets before giving up.
      history_limit:
        type: integer
        default: 20
        description: Most past messages sent with each turn.
  providers:
    type: object
    description: Named provider connections, as `[providers.<name>]`.
    additionalProperties:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [anthropic, openai, openai_compat, systemone]
          description: The provider. `systemone` serves decision models.
        api_key:
          type: string
          description: API key, usually a `${NAME}` reference to a variable or stored secret.
        base_url:
          type: string
          description: Endpoint for `openai_compat` and self-hosted providers.
        region:
          type: string
          description: Cloud region, where the provider needs one.
        profile:
          type: string
          description: Credentials profile, where the provider uses one.
  models:
    type: object
    description: Model roles, as `[models.<role>]`. Standard roles are `default`, `chat`, `drafter`, `planner`, `outliner`, `solver`, `repair`, `judge` and `decider`; any other name is a custom role.
    additionalProperties:
      type: object
      required: [provider, model]
      properties:
        provider:
          type: string
          description: A name from `[providers]`.
        model:
          type: string
          description: The provider's model id.
        temperature:
          type: number
          description: Sampling temperature.
        description:
          type: string
          description: What the role is for. Roles with a description are offered to drafters and steps by name.
        context_window:
          type: integer
          description: The model's context window in tokens.
        fallbacks:
          type: array
          description: Models to try, in order, when this one fails.
          items:
            type: object
            required: [provider, model]
            properties:
              provider:
                type: string
                description: A name from `[providers]`.
              model:
                type: string
                description: The provider's model id.
              temperature:
                type: number
                description: Sampling temperature.
              context_window:
                type: integer
                description: The model's context window in tokens.
  mcp:
    type: object
    description: MCP servers, as `[mcp.<name>]`. Their tools join the catalog as `<name>__<tool>`.
    additionalProperties:
      type: object
      properties:
        description:
          type: string
          description: What the server is for, read by drafters choosing tools.
        command:
          type: string
          description: Executable for a stdio server. Use `command` or `url`, not both.
        args:
          type: array
          items:
            type: string
          description: Arguments for `command`.
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment for a stdio server. Values expand `${NAME}` references.
        url:
          type: string
          description: Endpoint for a streamable HTTP server.
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers. Values expand `${NAME}` references.
        include_tools:
          type: array
          items:
            type: string
          description: Load only these tools.
        exclude_tools:
          type: array
          items:
            type: string
          description: Skip these tools.
        tool_overrides:
          type: object
          description: Per-tool corrections, as `[mcp.<name>.tool_overrides.<tool>]`.
          additionalProperties:
            type: object
            properties:
              description:
                type: string
                description: Replaces the server's description of the tool.
              output_schema:
                type: object
                description: The tool's output shape.
              output_example:
                type: object
                description: An example of the tool's output.
  plans:
    type: object
    description: Where plans are loaded from.
    properties:
      paths:
        type: array
        items:
          type: string
        default: ["./.graph/plans", "~/.config/graph/plans"]
        description: Plan directories, searched in order.
  tools:
    type: object
    description: Where tools come from.
    properties:
      paths:
        type: array
        items:
          type: string
        default: ["./.graph/tools", "~/.config/graph/tools"]
        description: Tool directories, searched in order.
      always_loaded:
        type: array
        items:
          type: string
        default: ["builtin__infer", "builtin__reshape", "builtin__flatten", "builtin__dedupe", "builtin__sort", "builtin__take", "builtin__rank"]
        description: Tools offered up front, never deferred behind a search. Plan drafting always offers them, and an agent gets the ones its `tools` list matches.
  packs:
    type: object
    description: Installed packs, as `[packs.<name>]`. Their tools, plans and agents join the catalog as `<name>__<kind>__<item>`.
    additionalProperties:
      type: object
      required: [git]
      properties:
        git:
          type: string
          description: The git repository the pack is installed from.
        path:
          type: string
          description: The pack's directory inside the repository, such as `github`. Its releases are the tags `<path>/vX.Y.Z`. The repository root when absent.
        ref:
          type: string
          description: The release line (`v1`), exact release (`v1.2.0`) or branch to install. Release refs name the pack's own version; graph adds the `<path>/` tag prefix.
        include:
          type: array
          items:
            type: string
          description: Glob patterns over `<kind>__<item>`, such as `plan__*`, naming the items callable from outside the pack. Everything when empty.
        exclude:
          type: array
          items:
            type: string
          description: Glob patterns over `<kind>__<item>` for items only the pack's own plans and agents can call.
  storage:
    type: object
    description: Where graph keeps state.
    properties:
      backend:
        type: string
        enum: [file, memory]
        default: file
        description: "`memory` keeps nothing between runs. `GRAPH_STORAGE` overrides it."
  user:
    type: object
    description: About you, for agent prompts.
    properties:
      name:
        type: string
        description: Your name.
      context:
        type: string
        description: Anything agents should know about you.
      timezone:
        type: string
        description: Your timezone, such as `America/New_York`.
  project:
    type: object
    description: This project's identity. Belongs in the project config.
    properties:
      id:
        type: string
        description: An id graph generates the first time you store a project secret with `graph secret set NAME --project`. Project secrets are keyed by it, so renaming or moving the folder keeps them. Letters, digits and hyphens.
  prompts:
    type: object
    description: Deprecated. Customize agents with agent files instead.
    properties:
      chat:
        type: string
        description: Deprecated.
      workbench:
        type: string
        description: Deprecated.
  workbench:
    type: object
    description: Workbench settings.
    properties:
      log_path:
        type: string
        description: Where the workbench writes its log. Defaults to `<data_dir>/workbench.log`; `GRAPH_WORKBENCH_LOG` overrides it.
  telemetry:
    type: object
    description: OpenTelemetry export over OTLP/HTTP.
    properties:
      endpoint:
        type: string
        description: The OTLP/HTTP endpoint. Telemetry is off without one.
      protocol:
        type: string
        enum: [http/protobuf, http/json]
        default: http/protobuf
        description: Wire format.
      timeout_secs:
        type: integer
        description: Export timeout in seconds.
      service_name:
        type: string
        description: The `service.name` resource attribute.
      headers:
        type: object
        additionalProperties:
          type: string
        description: Headers sent with every export, such as auth.
      resource:
        type: object
        additionalProperties:
          type: string
        description: Extra resource attributes.
      capture_content:
        type: boolean
        default: true
        description: Include prompts and responses in spans.
      logs:
        type: boolean
        default: false
        description: Export logs as well as traces.
  pricing:
    type: object
    description: Prices per model id, as `[pricing."<model>"]`, in USD per million tokens. Without them, usage is reported in tokens only.
    additionalProperties:
      type: object
      required: [input, output]
      properties:
        input:
          type: number
          description: Input tokens.
        output:
          type: number
          description: Output tokens.
        cache_write:
          type: number
          description: Cache-write tokens.
        cache_read:
          type: number
          description: Cache-read tokens.
x-environment:
  - group: Output and logging
    variables:
      - name: GRAPH_EVENTS
        description: How graph reports progress and failures on stderr. Unset, stderr is for people.
        values:
          jsonl: stderr becomes a stream of JSON events, one per line. `ask` steps can't prompt anyone, so they use their `whenUnanswered` setting.
          github: A failing `graph plan run` also prints a `::error::` annotation to stdout, which GitHub Actions shows on the run.
      - name: GRAPH_LOG
        type: string
        description: A log filter for stderr, such as `info` or `graph=debug`. `-v`, `-vv` and `-vvv` set `info`, `debug` and `trace`.
  - group: Secrets
    description: "`${NAME}` references in config.toml and in tool `env` values read the environment variable `NAME` first, then the OS credential store: this project's entry, then the one every project shares. See [Secret references](/reference/configuration#secret-references)."
    variables:
      - name: GRAPH_SECRET_STORE
        default: os
        description: Whether `${NAME}` references read the OS credential store when the environment doesn't set `NAME`.
        values:
          os: Read the macOS Keychain, or the Secret Service on Linux, under service `graph`. Where neither is available, graph reads the environment only.
          none: Read the environment only.
  - group: Storage
    variables:
      - name: GRAPH_STORAGE
        overrides: storage.backend
        default: file
        description: Where graph keeps threads and the shape cache.
        values:
          file: Under `settings.data_dir`.
          memory: In memory only. Nothing is kept between runs.
  - group: Workbench
    variables:
      - name: GRAPH_WORKBENCH_LOG
        type: string
        overrides: workbench.log_path
        default: <data_dir>/workbench.log
        description: Where the workbench writes its log.
  - group: Telemetry
    variables:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        type: string
        overrides: telemetry.endpoint
        description: The OTLP/HTTP endpoint to export to.
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        overrides: telemetry.protocol
        default: http/protobuf
        description: The export wire format.
        values:
          http/protobuf: Protobuf over HTTP.
          http/json: JSON over HTTP.
      - name: OTEL_EXPORTER_OTLP_TIMEOUT
        type: integer
        overrides: telemetry.timeout_secs
        description: Export timeout, in milliseconds.
      - name: OTEL_EXPORTER_OTLP_HEADERS
        type: string
        overrides: telemetry.headers
        description: Extra headers as comma-separated `key=value` pairs, added to the configured ones.
      - name: OTEL_SERVICE_NAME
        type: string
        overrides: telemetry.service_name
        description: The `service.name` resource attribute.
examples:
  - version: 4
    providers:
      anthropic:
        type: anthropic
        api_key: ${ANTHROPIC_API_KEY}
    models:
      default:
        provider: anthropic
        model: claude-sonnet-5-5
      judge:
        provider: anthropic
        model: claude-haiku-4-5-20251001
    mcp:
      linear:
        url: https://mcp.linear.app/mcp
        headers:
          Authorization: Bearer ${LINEAR_API_KEY}
    packs:
      github:
        git: github.com/tylerdavis/graph-packs
        path: github
        ref: v1
