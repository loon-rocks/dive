$schema: https://json-schema.org/draft/2020-12/schema
title: pack.toml
description: A pack's manifest, at the root of the pack's directory, naming the pack and the systems, programs, variables and MCP servers it needs.
x-format: TOML
x-locations:
  - "`<pack dir>/pack.toml`, such as `github/pack.toml` in a packs repository"
type: object
additionalProperties: false
required: [name, description, requires]
properties:
  version:
    type: integer
    description: The file version the manifest is written in. Omitted means 1.
  name:
    type: string
    description: The pack's name, which installs it as `[packs.<name>]` and prefixes its items as `<name>__<kind>__<item>`. Lowercase letters, digits and single underscores, starting with a letter, at most 20 characters. `user`, `plan`, `agent`, `builtin`, `workbench` and `pack` are reserved.
  description:
    type: string
    description: What the pack does, in one sentence. Must not be empty.
  license:
    type: string
    description: The pack's license, such as `MIT`.
  homepage:
    type: string
    description: Where to read about the pack, such as its directory in the repository.
  requires:
    type: object
    description: What the pack needs to run. `graph` and `os` are checked when the pack is installed or loaded, and a mismatch refuses it. `binaries`, `env` and `mcp` are reported by `graph config check`, and a plan run that reaches the pack fails before its first step when one is missing.
    required: [os]
    properties:
      graph:
        type: string
        description: The graph versions the pack works with, as a semver requirement such as `">=0.15"`.
      os:
        type: array
        items:
          type: string
          enum: [macos, linux]
        description: The systems the pack runs on, `macos`, `linux` or both. `graph pack check` refuses a pack that leaves it empty.
      binaries:
        type: array
        items:
          type: string
        description: Programs the pack's tools run, which must be on `PATH`.
      env:
        type: array
        items:
          type: string
        description: Environment variables the pack's tools read, which must be set and not empty.
      mcp:
        type: object
        description: MCP servers the pack's plans and agents call, as `[requires.mcp.<name>]`, where `<name>` is the `[mcp.<name>]` server their calls use, as in `<name>__<tool>`. `graph pack check` checks each call against the server when one is configured under that name.
        additionalProperties:
          type: object
          properties:
            server:
              type: string
              description: The name the server reports for itself.
            version:
              type: string
              description: The server versions the pack works with, as a semver requirement.
            url:
              type: string
              description: The server's URL, shown in the error when no `[mcp.<name>]` is configured.
examples:
  - version: 1
    name: github
    description: Read and comment on pull requests, releases and git history.
    license: MIT
    homepage: https://github.com/tylerdavis/graph-packs/tree/main/github
    requires:
      graph: ">=0.15"
      os: [macos, linux]
      binaries: [bash, git, gh, jq]
