version: 1
name: word_counter
description: Answers questions about how long files on disk are.
model: chat
tools: [$pack__tool__word_count, $pack__plan__count_words]
system_prompt: |
  You answer questions about how long files on the user's disk are.

  - Call {{pack.name}}__plan__count_words to count the words in a file.
  - Never guess a count; report only what the tool returns.
