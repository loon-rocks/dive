$schema: https://json-schema.org/draft/2020-12/schema
title: Tool file
description: One user tool, in `./.dive/tools/` or `~/.config/dive/tools/`, called as `user__<name>`. A file in a tools directory's `builtin/` subdirectory replaces the built-in tool it names instead.
x-format: YAML
x-locations:
  - "`./.dive/tools/<name>.yaml` (project)"
  - "`~/.config/dive/tools/<name>.yaml` (global)"
  - "`<tools dir>/builtin/<name>.yaml` (replaces a built-in tool)"
type: object
required: [name, description, kind]
properties:
  version:
    type: integer
    description: The file version the document is written in. Omitted means 1; `dive tool migrate` brings a file to the current version.
  name:
    type: string
    pattern: "^[A-Za-z0-9_-]+$"
    description: Letters, digits, `_` and `-`. The tool is called as `user__<name>`.
  description:
    type: string
    description: What the tool does and returns. Agents and the plan drafter read it when choosing tools.
  kind:
    type: string
    enum: [exec, http, prompt, reshape, decision, image]
    description: What the tool runs. Each kind takes its own fields, listed below.
  input_schema:
    type: object
    description: JSON Schema for the input, validated before the tool runs. Templates reference it as `{{input.<field>}}`.
  output_schema:
    type: object
    description: JSON Schema for the output. A `prompt` tool enforces it as structured output; for every kind it tells drafters what the tool returns.
  read_only:
    type: boolean
    description: Marks the tool as free of side effects. `reshape` and `decision` tools are read-only by default, and so is an `http` tool whose method is `GET`.
  generated:
    type: string
    description: The generator that wrote this file, such as `dive-go`. Set by the generator, never by hand. The desktop app and the drafters show a generated tool but don't edit or overwrite it; change it in the code it's generated from, then regenerate.
oneOf:
  - title: exec
    description: "Runs a command. stdout becomes the result; a non-zero exit, a timeout or unparseable JSON is a tool error. Exec tools run arbitrary code, by design. An input property with `format: blob` (or an array whose `items` have it) takes file refs, which reach the command as local paths. Files it writes go out through `files`: declare each by name, pass `{{files.<name>.path}}` in `args`, and the file comes back under the result's `files` with its `name` and a `ref`."
    properties:
      kind:
        const: exec
      command:
        type: string
        description: The executable.
      args:
        type: array
        items:
          type: string
        description: Arguments, as templates over `{{input.*}}` and, for declared files, `{{files.<name>.path}}` and `{{files.<name>.dir}}`.
      env:
        type: object
        additionalProperties:
          oneOf:
            - type: string
              description: The value.
            - type: object
              required: [value]
              additionalProperties: false
              properties:
                value:
                  type: string
                  description: The value, exactly as the plain string form takes it.
                description:
                  type: string
                  description: Markdown saying what the value is and where to get it, links included. Shown wherever the secret is asked for, and by `dive secret list`.
        description: Extra environment variables. Each value is a string, or `{value, description}` to say what a secret is and where to get it. Values expand `${VAR}` from Dive's environment or, when it's unset or empty there, from the OS credential store (the project's value first, then the global one). `${VAR:-default}` falls back to the default when neither has a value; a `${VAR}` with no default is a secret the tool needs. A tool from an installed pack also gets `DIVE_PACK_DIR`, the absolute path of the pack's installed directory, so it can run scripts and binaries the pack ships. The process gets Dive's own environment plus these variables, except in [serve mode](/reference/configuration#serve-mode), where it gets only `PATH` and `TMPDIR` from Dive's environment, these variables, and the `DIVE_` variables Dive sets.
      cwd:
        type: string
        description: Working directory for the process. Without one, the command runs in the project directory, except in a test run before the tool is saved, where a tool that isn't `read_only` runs in an empty scratch directory that's removed afterwards, with the project's path in `DIVE_PROJECT_DIR`.
      timeout_secs:
        type: integer
        default: 60
        description: Seconds before the process is killed.
      output:
        type: string
        enum: [json, text]
        default: json
        description: "`json` parses stdout as JSON; `text` returns it as `{text}`."
      files:
        type: object
        description: "Files the command writes, by name. Each call gets an empty directory; pass `{{files.<name>.path}}`, or `{{files.<name>.dir}}` for a pattern, in `args`. After a successful run each file is listed under the result's `files` with its `name`, and a pattern's files come back as a list. A declared file the command didn't write is a tool error unless it's `optional`."
        additionalProperties:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name:
              type: string
              description: The file name with its extension, such as `report.pdf`, or a pattern with `*` or `?`, such as `page-*.png`, for several files.
            optional:
              type: boolean
              description: When true, a missing file, or a pattern with no match, isn't an error.
    required: [command]
    examples:
      - version: 3
        name: open_prs
        description: Open pull requests in the current repository, newest first.
        kind: exec
        command: gh
        args: [pr, list, --state, open, --json, "number,title,author", --limit, "{{input.limit}}"]
        read_only: true
        input_schema:
          type: object
          required: [limit]
          properties:
            limit:
              type: integer
              description: Most pull requests to return
  - title: http
    description: "Makes one HTTP request per call and returns the response body. Every request carries `Idempotency-Key` (the same on every retry of the call), `Dive-Run-Id`, `Dive-Call-Path` and `User-Agent: dive/<version>`, plus `traceparent` when the run has a trace. When the run has a run token and the URL's origin is listed in [`[http].token_origins`](/reference/configuration#param-http), the token goes as `Authorization: Bearer <token>`; it never goes anywhere else, and never into the run's entries or logs. Redirects aren't followed: a 3xx is a tool error naming its `Location`. A 2xx body is the result. Any other answer is a tool error named for its kind, taken from the body's `error.code` or else the status: refused (422), rejected input (400), the run token refused (401, 403), an internal error (500, never retried; a `ref` in the body is quoted), unavailable (429, 502, 503) or timed out (408, 504). Unavailable, timed out, a network error and no answer within `timeout_secs` are retried per `retry`. The message quotes the body's `error.message`, or the start of the body."
    properties:
      kind:
        const: http
      method:
        type: string
        enum: [GET, POST, PUT, PATCH, DELETE]
        default: POST
        description: The HTTP method.
      url:
        type: string
        description: The URL, as a template over `{{input.*}}`; each value spliced in is percent-encoded. `${VAR}` resolves the same way as an exec tool's `env`, so a base URL can be `${APP_URL}` and a secret can sit in the URL.
      query:
        type: object
        additionalProperties:
          type: string
        description: Query parameters, each value a template over `{{input.*}}`. A value that is a single template whose input is missing is left out.
      headers:
        type: object
        additionalProperties:
          type: string
        description: Extra headers. Values expand `${VAR}` like exec `env`, so a static credential can come from a secret, but can't use `{{input.*}}`. A tool can't set `Authorization` on a call that also carries the run token; send its credential in another header.
      body:
        description: "`POST`, `PUT` and `PATCH` send the whole input as JSON. A body template, a JSON tree whose leaf strings are templates over `{{input.*}}` like a `reshape` tool's `shape`, sends that object instead. `GET` and `DELETE` send no body."
      timeout_secs:
        type: integer
        default: 30
        description: Seconds before one attempt times out.
      retry:
        type: object
        required: [attempts]
        additionalProperties: false
        properties:
          attempts:
            type: integer
            minimum: 1
            description: Total attempts, the first included. Retries wait 1, 2, then 4 seconds, or what `Retry-After` says.
        description: Retries for a network error, no answer within `timeout_secs`, or an answer that says the app is unavailable or timed out (429, 502, 503, 408, 504, or `error.code` `unavailable` or `timeout`). An internal error (500) is never retried. Without it, a call is tried once.
      output:
        type: string
        enum: [json, text]
        default: json
        description: "`json` parses the body as JSON, with an empty body as `{}`; `text` returns it as `{text}`."
      max_response_bytes:
        type: integer
        default: 4194304
        description: The largest body read; a larger one is a tool error.
    required: [url]
    examples:
      - version: 5
        name: create_issue
        description: Creates an issue in the tenant's tracker and returns its id and URL.
        kind: http
        method: POST
        url: "${APP_URL}/dive/tools/create_issue"
        retry:
          attempts: 3
        input_schema:
          type: object
          required: [title]
          properties:
            title:
              type: string
              description: One-line summary
        output_schema:
          type: object
          properties:
            id: {type: string}
            url: {type: string}
  - title: prompt
    description: One model call. The result is `{text}`, or validated JSON when `output_schema` is set.
    properties:
      kind:
        const: prompt
      prompt:
        type: string
        description: The message to send, as a template over `{{input.*}}`.
      system:
        type: string
        description: A fixed system prompt.
      model:
        type: string
        default: chat
        description: The model role that runs the call, standard or custom.
      caller_output_schema:
        type: boolean
        default: false
        description: Take `output_schema` from the call's input.
      caller_model:
        type: boolean
        default: false
        description: Let the call's `model` input pick the role.
      caller_system:
        type: boolean
        default: false
        description: Take `system` from the call's input.
    required: [prompt]
    examples:
      - version: 3
        name: summarize
        description: Summarizes text into a gist and three keywords.
        kind: prompt
        prompt: "Summarize into one sentence and three keywords: {{input.text}}"
        model: chat
        input_schema:
          type: object
          required: [text]
          properties:
            text:
              type: string
              description: The text to summarize
        output_schema:
          type: object
          required: [gist, keywords]
          properties:
            gist:
              type: string
            keywords:
              type: array
              items:
                type: string
  - title: reshape
    description: Builds a value in a new JSON shape from the input, with no process and no model call. Leaf strings are templates; a leaf that is exactly one template keeps the value's type.
    properties:
      kind:
        const: reshape
      shape:
        description: The output shape, as a JSON tree whose leaf strings are templates over `{{input.*}}`.
      caller_shape:
        type: boolean
        default: false
        description: Take `shape` from the call's input instead.
    examples:
      - version: 3
        name: pr_summary_row
        description: Turns a pull request into a table row.
        kind: reshape
        shape:
          number: "{{input.pr.number}}"
          title: "{{input.pr.title}}"
          author: "{{input.pr.author.login}}"
        input_schema:
          type: object
          required: [pr]
          properties:
            pr:
              type: object
              description: A pull request from gh
  - title: image
    description: "Generates images with an image model and stores them as files. The call's input takes `prompt`, `images` (refs to edit or reference), `aspect_ratio`, `size`, `count` and `path`; the result lists the images under `images`, each with a `ref`. Shipped as `builtin__generate_image`."
    properties:
      kind:
        const: image
      model:
        type: string
        default: image
        description: An image model role. A chat or decision role fails the call.
      caller_model:
        type: boolean
        default: false
        description: Let the call's `model` input pick the role.
    examples:
      - version: 3
        name: hero_art
        description: Draws a hero image for a landing page from a short brief.
        kind: image
        model: image
        input_schema:
          type: object
          required: [prompt]
          properties:
            prompt:
              type: string
              description: What to draw
  - title: decision
    description: Asks a decision model typed questions about the same state, each answered independently. The result maps each question name to its answer.
    properties:
      kind:
        const: decision
      state:
        description: The data to judge, as a template tree over `{{input.*}}`. Omitted, the call's `state` input is used.
      questions:
        type: object
        description: Question name to question. Each has a `type` (`likelihood`, `choice` or `score`), `instructions`, and `criteria` for that type.
      model:
        type: string
        default: decider
        description: A decision model role. A chat role fails the call.
      caller_questions:
        type: boolean
        default: false
        description: Take `questions` from the call's input instead.
      caller_model:
        type: boolean
        default: false
        description: Let the call's `model` input pick the role.
    examples:
      - version: 3
        name: triage
        description: Routes a support ticket and checks whether it is urgent.
        kind: decision
        model: decider
        state:
          ticket: "{{input.ticket}}"
        questions:
          team:
            type: choice
            instructions: Which team should handle this ticket?
            criteria:
              billing: Payments
              technical: Bugs
          urgent:
            type: likelihood
            instructions: Does the ticket convey urgency?
        input_schema:
          type: object
          required: [ticket]
          properties:
            ticket:
              type: string
              description: The ticket text
