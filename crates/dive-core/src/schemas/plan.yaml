$schema: https://json-schema.org/draft/2020-12/schema
title: Plan file
description: One plan, in `./.graph/plans/` or `~/.config/graph/plans/`, run with `graph plan run` and called by agents and other plans as `plan__<identifier>`.
x-format: YAML
x-locations:
  - "`./.graph/plans/<identifier>.yaml` (project)"
  - "`~/.config/graph/plans/<identifier>.yaml` (global)"
type: object
required: [identifier, name, description, steps, finish]
additionalProperties: false
properties:
  version:
    type: integer
    description: The file version the document is written in. Omitted means 1; `graph plan migrate` brings a file to the current version.
  identifier:
    type: string
    pattern: "^[A-Za-z0-9_-]+$"
    description: Letters, digits, `_` and `-`. The plan is called as `plan__<identifier>`, and a plan with a built-in plan's identifier replaces it.
  name:
    type: string
    description: Display name.
  description:
    type: string
    description: What the plan does. Agents read it when choosing tools.
  exemplars:
    type: array
    items:
      type: string
    description: Example requests the plan handles, added to its tool description.
  requires_servers:
    type: array
    items:
      type: string
    description: MCP servers the steps use. The plan is hidden from the catalog while any of them isn't configured.
  input_schema:
    type: object
    description: JSON Schema for the plan's inputs, validated before any step runs. Steps reference inputs as `{{input.<field>}}`.
  steps:
    type: array
    description: The steps, run in order.
    items:
      type: object
      required: [id, tool_name, input]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          description: Unique across the plan, including steps inside bodies. Later steps read the result as `{{<id>.<field>}}`. Can't be `input`, `item`, `index`, `accumulator` or `length`.
        tool_name:
          type: string
          description: A catalog tool (`<server>__*`, `user__*`, `builtin__*`, `plan__*`, `agent__*`) or a control step (`exit`, `route`, `filter`, `map`, `reduce`, `agent`, `ask`).
        input:
          type: object
          description: The tool's input. String values are templates over `input` and earlier results; a control step's input is described on its page.
        reasoning:
          type: string
          description: Why the step exists, for people reading the plan.
  output_schema:
    type: object
    description: JSON Schema for the result of an output plan. Its `properties` must match the keys of `finish.output`.
  finish:
    x-type: '"silent" | object'
    description: "How the plan ends, and what it returns: `silent`, `output` or `solver`."
    oneOf:
      - const: silent
        description: Runs the steps and returns nothing but `{ok, steps_executed}`.
      - type: object
        required: [output]
        additionalProperties: false
        properties:
          output:
            type: object
      - type: object
        required: [solver]
        additionalProperties: false
        properties:
          solver:
            type: object
    properties:
      output:
        type: object
        description: Returns this map as JSON, each template filled from step results. No model call.
      solver:
        type: object
        description: A model call writes the answer as prose, returned as `{answer}`.
        required: [query_to_answer]
        additionalProperties: false
        properties:
          query_to_answer:
            type: string
            description: What the answer should say, as a template.
          system_prompt:
            type: string
            description: Extra system prompt for the solver call.
          data:
            type: object
            description: What the solver sees, as a map of templates over step results.
examples:
  - version: 2
    identifier: weekly_changes
    name: Weekly changes
    description: Summarizes the commits merged since a git ref.
    input_schema:
      type: object
      required: [base]
      properties:
        base:
          type: string
          description: The ref to start after, such as the last release tag
    steps:
      - id: commits
        tool_name: github__tool__git_log
        input:
          base: "{{input.base}}"
          head: HEAD
      - id: nothing_shipped
        tool_name: exit
        input:
          when:
            value: "{{commits.count}}"
            op: eq
            to: 0
          status: success
          message: Nothing merged since {{input.base}}
    finish:
      solver:
        query_to_answer: Summarize what changed, grouped by theme.
        data:
          commits: "{{commits.commits}}"
