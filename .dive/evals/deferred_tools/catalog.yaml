crm:
  find_contact:
    description: Look up a customer contact by name or email and return their profile, company and owner.
    params: {query: Name or email of the contact}
    returns: {id: c_481, name: Dana Whitfield, email: dana@northwind.io, company: Northwind, owner: Priya}
  list_deals:
    description: List open sales deals, optionally for one company, with stage, amount and close date.
    params: {company: "Company name, or empty for all"}
    returns: {deals: [{id: d_77, company: Northwind, stage: negotiation, amount: 48000, close: "2026-11-14"}]}
  update_deal_stage:
    description: Move a sales deal to a new pipeline stage.
    params: {deal_id: The deal id, stage: The new stage}
    returns: {id: d_77, stage: closed_won}
  log_call:
    description: Record a phone call with a contact on their CRM timeline.
    params: {contact_id: The contact id, notes: What was discussed}
    returns: {logged: true}
  list_accounts:
    description: List customer accounts with their tier, region and account manager.
    params: {region: "Region filter, or empty"}
    returns: {accounts: [{name: Northwind, tier: enterprise, region: EMEA, manager: Priya}]}
  merge_contacts:
    description: Merge two duplicate contact records into one.
    params: {keep_id: Contact to keep, merge_id: Contact to fold into it}
    returns: {merged: true}
  account_health:
    description: Health score for a customer account from usage, support load and renewal risk.
    params: {account: Account name}
    returns: {account: Northwind, score: 62, risk: medium, drivers: [ticket volume up 40%]}
  create_lead:
    description: Create a new sales lead from a name, email and source.
    params: {name: Lead name, email: Lead email, source: Where the lead came from}
    returns: {id: l_12, status: new}
  assign_owner:
    description: Assign a sales owner to an account or deal.
    params: {record_id: Account or deal id, owner: The new owner}
    returns: {assigned: true}
  list_tasks:
    description: List follow-up tasks due for a sales rep.
    params: {owner: The rep's name}
    returns: {tasks: [{id: t_3, title: Send Northwind pricing, due: "2026-10-22"}]}
billing:
  list_invoices:
    description: List invoices for a customer with amount, status (paid, open, overdue) and due date.
    params: {customer: Customer name}
    returns: {invoices: [{id: inv_2201, amount: 12000, status: overdue, due: "2026-10-01"}]}
  get_invoice:
    description: Get one invoice's line items, taxes and payment history.
    params: {invoice_id: The invoice id}
    returns: {id: inv_2201, lines: [{item: Enterprise seats, qty: 40, amount: 12000}], payments: []}
  issue_refund:
    description: Refund all or part of a paid invoice to the customer's card.
    params: {invoice_id: The invoice id, amount: Amount to refund}
    returns: {refund_id: re_19, status: pending}
  subscription_status:
    description: A customer's current subscription plan, seat count, renewal date and billing interval.
    params: {customer: Customer name}
    returns: {plan: enterprise, seats: 40, renews: "2027-01-01", interval: annual}
  change_plan:
    description: Upgrade or downgrade a customer's subscription plan.
    params: {customer: Customer name, plan: The new plan}
    returns: {plan: growth, effective: next_cycle}
  apply_coupon:
    description: Apply a discount coupon code to a customer's next invoice.
    params: {customer: Customer name, code: Coupon code}
    returns: {applied: true, discount: 15%}
  revenue_report:
    description: Monthly recurring revenue, churned revenue and expansion for a month.
    params: {month: Month as YYYY-MM}
    returns: {mrr: 412000, churned: 9000, expansion: 21000}
  payment_methods:
    description: List the cards and bank accounts on file for a customer.
    params: {customer: Customer name}
    returns: {methods: [{type: card, last4: "4242", expires: "2027-03"}]}
  dunning_status:
    description: Where a customer is in the failed-payment retry and reminder sequence.
    params: {customer: Customer name}
    returns: {stage: second_reminder, next_retry: "2026-10-24"}
  tax_settings:
    description: A customer's tax ID, exemption status and billing address.
    params: {customer: Customer name}
    returns: {tax_id: GB123456789, exempt: false}
support:
  search_tickets:
    description: Search support tickets by keyword, customer or status.
    params: {query: "Keywords, customer or status"}
    returns: {tickets: [{id: T-9012, subject: SSO login loop, status: open, priority: high}]}
  get_ticket:
    description: A support ticket's full conversation, assignee and SLA timers.
    params: {ticket_id: The ticket id}
    returns: {id: T-9012, assignee: Marco, sla_breach_in: 3h, messages: 6}
  reply_ticket:
    description: Post a public reply to the customer on a support ticket.
    params: {ticket_id: The ticket id, body: Reply text}
    returns: {posted: true}
  escalate_ticket:
    description: Escalate a support ticket to engineering with a severity.
    params: {ticket_id: The ticket id, severity: sev1 to sev4}
    returns: {escalated: true, linked_issue: ENG-3301}
  close_ticket:
    description: Mark a support ticket solved.
    params: {ticket_id: The ticket id}
    returns: {status: solved}
  csat_scores:
    description: Customer satisfaction scores for support over a period, by agent.
    params: {period: e.g. last_30_days}
    returns: {overall: 4.4, by_agent: [{agent: Marco, score: 4.6}]}
  macro_list:
    description: List saved reply macros support agents can apply.
    params: {query: Keyword}
    returns: {macros: [{id: m_4, title: Password reset steps}]}
  queue_load:
    description: How many tickets are waiting in each support queue and the oldest wait time.
    params: {queue: "Queue name, or empty for all"}
    returns: {queues: [{name: tier1, waiting: 37, oldest: 5h}]}
  add_internal_note:
    description: Add a private note on a ticket visible only to support staff.
    params: {ticket_id: The ticket id, note: Note text}
    returns: {added: true}
  merge_tickets:
    description: Merge duplicate tickets from the same customer.
    params: {keep_id: Ticket to keep, merge_id: Ticket to merge}
    returns: {merged: true}
calendar:
  list_events:
    description: List calendar events for a person on a date.
    params: {person: Whose calendar, date: Date as YYYY-MM-DD}
    returns: {events: [{title: Northwind QBR, start: "10:00", end: "11:00"}]}
  find_free_slot:
    description: Find a meeting time when every attendee is free.
    params: {attendees: Comma-separated names, duration_minutes: Meeting length}
    returns: {slot: {date: "2026-10-23", start: "14:00"}}
  create_event:
    description: Create a calendar event and invite attendees.
    params: {title: Event title, start: ISO start time, attendees: Comma-separated names}
    returns: {id: ev_88, created: true}
  cancel_event:
    description: Cancel a calendar event and notify attendees.
    params: {event_id: The event id}
    returns: {cancelled: true}
  book_room:
    description: Book a meeting room for a time slot.
    params: {room: Room name, start: ISO start time}
    returns: {booked: true}
  out_of_office:
    description: Who is out of office on a date.
    params: {date: Date as YYYY-MM-DD}
    returns: {out: [Marco, Lena]}
  timezone_of:
    description: A colleague's time zone and current local time.
    params: {person: Name}
    returns: {tz: Europe/Berlin, local: "17:42"}
  reschedule_event:
    description: Move a calendar event to a new time.
    params: {event_id: The event id, start: New ISO start time}
    returns: {moved: true}
email:
  search_mail:
    description: Search the user's mailbox by sender, subject or words.
    params: {query: Search terms}
    returns: {messages: [{id: msg_5, from: dana@northwind.io, subject: Renewal questions}]}
  read_mail:
    description: Read one email message in full.
    params: {message_id: The message id}
    returns: {body: "Can you send the renewal quote by Friday?"}
  send_mail:
    description: Send an email.
    params: {to: Recipient address, subject: Subject line, body: Message body}
    returns: {sent: true}
  draft_mail:
    description: Save an email draft without sending it.
    params: {to: Recipient address, subject: Subject line, body: Message body}
    returns: {draft_id: dr_2}
  list_threads_unread:
    description: Unread email threads, newest first.
    params: {limit: How many}
    returns: {threads: [{subject: Renewal questions, from: Dana Whitfield}]}
  mail_rules:
    description: List the mailbox's filtering rules.
    params: {query: Keyword}
    returns: {rules: [{name: Invoices to Finance}]}
docs:
