    params: {severity: "Severity filter, or empty"}
    returns: {incidents: [{id: INC-77, sev: sev2, commander: Ana, services: [checkout]}]}
  declare_incident:
    description: Declare a new incident and page the on-call.
    params: {title: What is broken, severity: sev1 to sev4}
