name: Release

on:
  push:
    tags: ["v*"]
  # Backfill path: publish a container image for a release that already has
  # binaries, without rebuilding them (e.g. after changing the Dockerfile).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the image for (e.g. v0.3.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  # See ci.yaml: compiler-invocation caching.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    # Binaries already exist for a dispatch-backfilled tag.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - uses: mozilla/sccache-action@v0.0.10

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p dive-cli

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --options runtime --timestamp \
            --identifier rocks.loon.dive --sign "$APPLE_SIGNING_IDENTITY" target/release/dive
          codesign --verify --strict --verbose=2 target/release/dive
          ditto -c -k target/release/dive "$RUNNER_TEMP/dive-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/dive-notarize.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          status="$(jq -r .status "$RUNNER_TEMP/notary.json")"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

      - name: Package
        run: |
          cd target/release
          tar czf "dive-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" dive
          shasum -a 256 "dive-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz" > "dive-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dive-${{ matrix.asset }}
          path: target/release/dive-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz*
          if-no-files-found: error

  # Releases are immutable once published (assets can never be added or
  # changed), so the release is created exactly once, atomically, with
  # every asset attached — after all platform builds succeed.
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --generate-notes assets/*

  docs:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the docs for this release
        run: git push origin "HEAD:refs/heads/docs-live"

      - name: Rebuild the docs site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: gh api repos/loon-rocks/site/dispatches -f event_type=docs-live

  # Container image for CI (and docker run): the linux binary plus git/jq/gh.
  # Tagged vX.Y.Z, X.Y, and latest. Runs after the release exists on tag
  # pushes, standalone on workflow_dispatch backfills.
  image:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release binary
        run: |
          asset="dive-$TAG-linux-x86_64.tar.gz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset*"
          shasum -a 256 -c "$asset.sha256"
          tar xzf "$asset"

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          repo="ghcr.io/${{ github.repository }}"
          minor="${TAG#v}"; minor="${minor%.*}"
          docker build -t "$repo:$TAG" -t "$repo:$minor" -t "$repo:latest" .
          docker push "$repo:$TAG"
          docker push "$repo:$minor"
          docker push "$repo:latest"
