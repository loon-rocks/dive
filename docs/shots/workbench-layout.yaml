chat: "what does this plan do?"

llm:
  - text: >-
      unreleased_changes finds the latest GitHub release, lists the commits
      since its tag, and then, four commits at a time, reads the files each
      commit changed and writes a one-line release note for it. It returns the
      release tag and the notes. Press r to run it, or g to debug it.

