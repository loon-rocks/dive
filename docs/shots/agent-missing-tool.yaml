name: agent-missing-tool
title: graph workbench — sketching an agent network
grid: { cols: 120, rows: 36 }

agent: network_drafter

chat: "yes, and it posts the notes to our changelog page"

llm:
  - call: workbench__set_sketch
    input:
      restate:
        outcome: Release notes written from the commits since a tag and posted to the changelog page
        success: Short, customer-facing notes, published, with the entry's URL back
        constraint: One agent turn per release
        out_of_scope: [Internal changes such as CI and tooling]
      nodes:
        - name: post_changelog
          kind: tool
          job: Publishes notes to the changelog page and returns the entry's URL
          principles: [No model needed]
        - name: release_notes
          kind: agent
          job: Writes the notes from the commits since a tag, then posts them
          model: chat
          principles: [Plans before agents]
      edges:
        - { from: release_notes, to: post_changelog, kind: calls }
  - text: >-
      None of your tools can post to the changelog page, so the sketch has a tool node for it:
      post_changelog, a plain API call with no model. release_notes calls it once the notes
      are written. Build it?

capture:
  at: loaded
