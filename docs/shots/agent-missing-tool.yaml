name: agent-missing-tool
title: graph workbench — drafting an agent
grid: { cols: 120, rows: 36 }

agent: agent_drafter

chat: "it should also post the notes to our changelog page"

llm:
  - call: workbench__set_artifact
    input:
      kind: agent
      yaml: |
        name: release_notes
        description: Writes customer-facing release notes from the commits since a tag and posts them to the changelog page.
        model: chat
        tools: [builtin__git_log]
        input_schema:
          type: object
          required: [since]
          properties:
            since: { type: string, description: The tag to start from, such as v0.15.0 }
        output_schema:
          type: object
          required: [notes]
          properties:
            notes: { type: string, description: The release notes in markdown }
        system_prompt: |
          You write release notes for one release. Read the commits since the given tag with
          builtin__git_log, group them into features and fixes, and write short, customer-facing
          notes. Leave out internal changes such as CI and tooling.
  - text: >-
      None of your tools can post to the changelog page yet. Should I draft one now? It would
      take the notes and the version, and return the published entry's URL.

capture:
  at: loaded
