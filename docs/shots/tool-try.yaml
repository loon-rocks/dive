name: tool-try
title: dive workbench — test-running a tool
grid: { cols: 120, rows: 36 }

agent: network_drafter

chat: "yes, build it"

llm:
  - call: workbench__set_sketch
    input:
      restate:
        outcome: A tool that lists the pull requests merged into this repository since a date
        success: Each merged pull request comes back with its number, title and merge time
        constraint: No model; the gh CLI does the work
        out_of_scope: [Other repositories, Open or closed pull requests]
      nodes:
        - name: merged_prs
          kind: tool
          job: Lists the pull requests merged since a date with the gh CLI
          principles: [No model needed]
  - call: agent__tool_drafter
    input:
      node: merged_prs
  - call: workbench__set_artifact
    input:
      kind: tool
      yaml: |
        name: merged_prs
        description: Pull requests merged into this repository since a date, as number, title and merge time.
        kind: exec
        command: gh
        args:
          - pr
          - list
          - --state
          - merged
          - --search
          - "merged:>={{input.since}}"
          - --json
          - number,title,mergedAt
        read_only: true
        input_schema:
          type: object
          required: [since]
          properties:
            since:
              type: string
              description: The earliest merge date, as YYYY-MM-DD
  - call: workbench__try_artifact
    input:
      kind: tool
      input: { since: "2026-09-24" }

capture:
  pause_at: try_tool
  turn_seconds: 4
