name: plan-drafting-questions
title: dive workbench — drafting a plan
grid: { cols: 120, rows: 36 }

agent: network_drafter

chat: "a plan called unreleased_changes that writes a one-line release note for each commit since the latest GitHub release, from its subject and the files it changed"

llm:
  - call: plan__search_tools
    input:
      query: List the commits since the latest GitHub release with the files each changed
  - call: workbench__set_interview
    input:
      reply: |-
        My read: release notes you can paste, one line per commit since the latest release. 75% confident; missing: which commits count.

        Question: should merge commits get a note of their own?
        My guess: no. Their subjects repeat the PRs they merge, so they'd double the list.
      confidence: 75
      missing: which commits count
      question: Should merge commits get a note of their own?
      guess: No. Their subjects repeat the PRs they merge, so they'd double the list.
      facts:
        - { label: Outcome, text: One-line release note per commit since the latest release, state: known }
        - { label: Where, text: This repository's git history and GitHub releases, state: known }
        - { label: Merge commits, text: Left out, state: asking }
        - { label: Success, text: "", state: missing }
        - { label: Out of scope, text: Posting the notes anywhere, state: guess }

capture:
  at: loaded
