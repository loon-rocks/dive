name: debug-breakpoint
title: graph workbench — paused at a breakpoint
plan: docs/shots/plans/unreleased_changes.yaml
grid: { cols: 120, rows: 36 }

chat: "debug run, pause before commits"

llm:
  - call: workbench__try_artifact
    input:
      kind: plan
      gated: true
      breakpoints: [commits]

tools:
  github__tool__gh_release:
    - tag: v0.16.0
      name: v0.16.0
      body: ""
      url: https://github.com/tylerdavis/graph/releases/tag/v0.16.0
      published_at: "2026-10-14T23:36:31Z"
      author: github-actions[bot]
      is_prerelease: false
      is_draft: false
      target: main
      previous_tag: v0.15.0

capture:
  pause_at: commits
  turn_seconds: 2
  crop: workspace
